name: Olympiad CI Check

on:
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify protected files were not modified
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main..HEAD)
          if echo "$CHANGED" | grep -qE "^src/test/|Vehicle\.java$|ParkingSpot\.java$"; then
            echo "❌ Помилка: змінено захищені файли (тести або моделі)!"
            exit 1
          fi

      - name: Run JUnit tests
        run: mvn test -B

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Результати олімпіадних тестів
          path: target/surefire-reports/*.xml
          reporter: java-junit